[versions]
kotlin = "2.4.0"
gradleVersionsCheck = "0.54.0"
junitJupiter = "6.0.3"
jvm = "25"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junitJupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitJupiter" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
gradle-versions-check = { id = "com.github.ben-manes.versions", version.ref = "gradleVersionsCheck" }
